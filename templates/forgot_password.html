
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - Gateball Lovers</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #222;
        }
        .card {
            max-width: 430px;
            margin: 50px auto;
            padding: 24px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 14px;
            box-shadow: 0 2px 8px #00000012;
        }
        h1 {
            color: #d88900;
            text-align: center;
            font-size: 25px;
        }
        p {
            line-height: 1.5;
            color: #555;
        }
        label {
            font-weight: bold;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 12px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
        }
        button, .back {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: 0;
            border-radius: 10px;
            background: #f4a300;
            color: #fff;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .back {
            background: #eee;
            color: #222;
        }
        .message {
            padding: 12px;
            margin: 14px 0;
            border-radius: 8px;
            background: #fff3d6;
            line-height: 1.5;
        }
        .creator {
            margin-top: 25px;
            text-align: center;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Gateball Lovers</h1>
        <h2>Forgot Password?</h2>
        <p>Enter the email address registered with your Gateball Lovers account. We will send instructions to reset your password.</p>

        {% if message %}
        <div class="message" role="status">{{ message }}</div>
        {% endif %}

        <form method="post" action="/forgot-password">
            <label for="email">Registered Email</label>
            <input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
                placeholder="Enter your email address"
            >
            <button type="submit">SEND RESET EMAIL</button>
        </form>

        <a class="back" href="/login">Back to Login</a>

        <div class="creator">Created by Biswa Ranjan Mishra</div>
    </div>
</body>
</html>
