<body>
    <div class="card">
        <h1>Gateball Lovers</h1>
        <h2>Set a New Password</h2>

        <p>
            Enter your new password below. You will be able to log in
            with it after the password has been updated successfully.
        </p>

        <div id="message" class="message" role="status" hidden></div>

        <form id="resetForm">
            <label for="password">New Password</label>
            <input
                id="password"
                type="password"
                required
                minlength="8"
                autocomplete="new-password"
                placeholder="Enter new password"
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                id="confirmPassword"
                type="password"
                required
                minlength="8"
                autocomplete="new-password"
                placeholder="Re-enter new password"
            >

            <button id="submitButton" type="submit">
                UPDATE PASSWORD
            </button>
        </form>

        <a class="back" href="/login">Back to Login</a>

        <div class="creator">Created by Biswa Ranjan Mishra</div>
    </div>

    <script>
        const SUPABASE_URL = {{ supabase_url | tojson }};
        const SUPABASE_KEY = {{ supabase_key | tojson }};

        const form = document.getElementById("resetForm");
        const messageBox = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");

        function showMessage(message) {
            messageBox.textContent = message;
            messageBox.hidden = false;
        }

        // The recovery link normally provides the access token in
        // the URL fragment after Supabase verifies the email link.
        const params = new URLSearchParams(
            window.location.hash.substring(1)
        );

        const accessToken = params.get("access_token");
        const recoveryType = params.get("type");

        // Also handle an authentication error returned in the URL.
        const authError = params.get("error_description");

        if (authError) {
            showMessage(
                "This password-reset link could not be verified. " +
                "Please request a new reset email."
            );
            form.hidden = true;
        } else if (!accessToken || recoveryType !== "recovery") {
            showMessage(
                "A valid password-reset link is required. " +
                "Please open the latest reset email or request a new one."
            );
            form.hidden = true;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                showMessage("Your password must be at least 8 characters.");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("The two passwords do not match.");
                return;
            }

            if (!accessToken || recoveryType !== "recovery") {
                showMessage(
                    "Your reset link is invalid or expired. " +
                    "Please request a new reset email."
                );
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "UPDATING...";
            messageBox.hidden = true;

            try {
                const response = await fetch(
                    SUPABASE_URL + "/auth/v1/user",
                    {
                        method: "PUT",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + accessToken,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            password: password
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    console.error("Password update failed:", result);

                    showMessage(
                        "Password update failed. Your reset link may " +
                        "have expired. Please request a new reset email."
                    );
                    return;
                }

                form.hidden = true;
                showMessage(
                    "Your password has been updated successfully. " +
                    "Please return to the login page and sign in " +
                    "with your new password."
                );

                // Remove the recovery token from the browser URL.
                window.history.replaceState(
                    {},
                    document.title,
                    window.location.pathname
                );

            } catch (error) {
                console.error("Password update error:", error);

                showMessage(
                    "Unable to connect to the server. Please try again."
                );
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "UPDATE PASSWORD";
            }
        });
    </script>
</body>
</html>
