<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Profile - Gateball Lovers</title>
<style>
.photo-preview{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #f4a300;display:block;margin:0 auto 12px}.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo-btn{padding:11px;margin:0!important;background:#d88900!important}.hint{font-size:12px;color:#777;text-align:center;margin:8px 0 14px}
body{font-family:Arial;background:#fff8e8;margin:0;padding:20px}
.wrap{max-width:430px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px}
h1{color:#d88900}label{display:block;margin-top:12px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button,a{display:block;width:100%;padding:13px;margin-top:16px;border:0;border-radius:10px;background:#f4a300;color:white;font-weight:bold;text-align:center;text-decoration:none;box-sizing:border-box}
a{background:#777}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>👤 Edit Profile</h1>
<form method="post" id="profileForm">
<div style="text-align:center">
{% if profile.photo_url %}<img id="photoPreview" src="{{ profile.photo_url }}" class="photo-preview" alt="Profile photo">{% else %}<div id="photoPlaceholder" style="font-size:72px;text-align:center">👤</div><img id="photoPreview" src="" class="photo-preview" alt="Profile photo" style="display:none">{% endif %}
<div class="hint">Choose a photo from your phone or take a new photo with the camera.</div>
<div class="photo-actions">
<label class="photo-btn">📷 TAKE PHOTO<input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none"></label>
<label class="photo-btn">🖼️ CHOOSE PHOTO<input id="galleryInput" type="file" accept="image/*" style="display:none"></label>
</div>
<div id="uploadStatus" class="hint"></div>
</div>
<input type="hidden" name="photo_url" id="photo_url" value="{{ profile.photo_url or '' }}">
<label>Full Name</label>
<input name="full_name" required value="{{ profile.full_name or '' }}">
<label>Country</label>
<select name="country" required>
{% for country in countries %}<option value="{{ country }}" {% if profile.country == country %}selected{% endif %}>{{ country }}</option>{% endfor %}
</select>
<label>Contact Number</label>
<input name="phone" value="{{ profile.phone or '' }}">
<button type="submit" id="saveButton">SAVE CHANGES</button>
<a href="{{ url_for('profile') }}">BACK TO PROFILE</a>
</form>
</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL={{ supabase_url|tojson }};
const SB_KEY={{ supabase_publishable_key|tojson }};
const SB_TOKEN={{ access_token|tojson }};
const sb=window.supabase.createClient(SB_URL,SB_KEY,{global:{headers:{Authorization:'Bearer '+SB_TOKEN}}});
const preview=document.getElementById('photoPreview');
const placeholder=document.getElementById('photoPlaceholder');
const statusEl=document.getElementById('uploadStatus');
const photoUrl=document.getElementById('photo_url');
async function uploadPhoto(file){
 if(!file)return;
 if(!file.type.startsWith('image/')){statusEl.textContent='Please choose an image file.';return;}
 if(file.size>5*1024*1024){statusEl.textContent='Photo must be 5 MB or smaller.';return;}
 const localUrl=URL.createObjectURL(file); preview.src=localUrl; preview.style.display='block'; if(placeholder)placeholder.style.display='none';
 statusEl.textContent='Uploading photo...';
 try{
   const {data:userData,error:userError}=await sb.auth.getUser(); if(userError)throw userError;
   const uid=userData.user.id;
   const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
   const path=uid+'/profile_'+Date.now()+'.'+ext;
   const {error}=await sb.storage.from('profile-photos').upload(path,file,{contentType:file.type,upsert:false});
   if(error)throw error;
   const {data}=sb.storage.from('profile-photos').getPublicUrl(path);
   photoUrl.value=data.publicUrl; statusEl.textContent='✓ Photo uploaded. Press SAVE CHANGES.';
 }catch(e){console.error(e);statusEl.textContent='Photo upload failed: '+(e.message||'Please try again.');}
}
document.getElementById('cameraInput').addEventListener('change',e=>uploadPhoto(e.target.files[0]));
document.getElementById('galleryInput').addEventListener('change',e=>uploadPhoto(e.target.files[0]));
document.getElementById('profileForm').addEventListener('submit',e=>{if(!photoUrl.value && statusEl.textContent.includes('Uploading')){e.preventDefault();alert('Please wait for the photo upload to finish.');}});
</script></body>
</html>
