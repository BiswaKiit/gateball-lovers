<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gateball Lovers - Sign Up</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#222}
.page{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding-bottom:78px}
.header{background:#f4a300;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:5}
.header h1{margin:0;font-size:21px}.header p{margin:4px 0 0;font-size:12px}
.content{padding:14px}.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000012}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px;background:#f4a300;color:#fff;font-weight:bold;cursor:pointer;text-decoration:none;text-align:center;margin-top:8px}
.btn.secondary{background:#eee;color:#222}.btn.green{background:#299447}.btn.red{background:#d64545}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:5px 0 10px;font-size:15px}
label{font-weight:bold;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center;background:#fff3d6;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px;color:#d88900}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs a{margin:0!important;padding:10px 4px!important}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#fff0c8;color:#9a6500;font-size:11px;font-weight:bold}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#777;font-size:13px}
.creator{margin:20px 0;text-align:center;color:#777;font-size:12px}.message{padding:10px;border-radius:9px;background:#f7f7f7;margin:8px 0}
.logo{width:88px;height:88px;object-fit:contain}.center{text-align:center}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd;z-index:10}
.bottom a{padding:11px 4px;text-align:center;text-decoration:none;color:#555;font-size:12px}.bottom a.active{color:#d88900;font-weight:bold}
.field-hint{font-size:12px;color:#8a5a00;margin:-5px 0 10px 2px}
.country-picker{position:relative;margin:5px 0 10px}
.country-picker input[type=text]{margin:0}
.country-options{display:none;position:absolute;left:0;right:0;top:calc(100% + 2px);max-height:230px;overflow:auto;background:#fff;border:2px solid #e4bd78;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.16);z-index:30}
.country-option{padding:11px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f1e4cf}
.country-option:last-child{border-bottom:0}.country-option:hover,.country-option.active{background:#fff0c7;color:#8b4f00;font-weight:bold}
.country-picker.open .country-options{display:block}
.password-ok{color:#16803b!important}.password-bad{color:#b3261e!important}
</style>

<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/gateball-theme.css">
<script defer src="/static/gateball-app.js"></script>
<meta name="theme-color" content="#F47700">
</head>
<body><div class="page"><div class="header"><h1>Create Account</h1><p>Join the Gateball Family</p></div><div class="content"><div class="card">
<form method="post" action="/signup"><label>Full Name</label><input name="full_name" required>
<label>Email</label><input name="email" type="email" required><label>Password</label>
<input id="signupPassword" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Minimum 8 characters">
<div class="field-hint">Password must be at least 8 characters.</div>
<label>Country</label>
<div class="country-picker" id="countryPicker">
  <input id="countrySearch" type="text" autocomplete="off" placeholder="Search or select your country" aria-label="Search country">
  <input id="countryValue" name="country" type="hidden" required>
  <div id="countryOptions" class="country-options" role="listbox"></div>
</div><label>Phone</label><input name="phone" type="tel">
<label>Role</label><select name="role"><option>Player</option><option>Organizer</option></select>
<button class="btn" type="submit">CREATE ACCOUNT</button></form>
<a class="btn secondary" href="/">BACK TO LOGIN</a></div><div class="creator">Created by Biswa Ranjan Mishra</div></div></div><script>
(function(){
  const countries={{ countries|tojson }};
  const picker=document.getElementById('countryPicker');
  const search=document.getElementById('countrySearch');
  const value=document.getElementById('countryValue');
  const options=document.getElementById('countryOptions');
  const form=search.closest('form');
  function render(){
    const q=(search.value||'').trim().toLowerCase();
    const list=countries.filter(c=>!q||c.toLowerCase().includes(q));
    options.innerHTML=list.length?list.map(c=>'<div class="country-option" role="option" data-value="'+c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')+'">'+c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>').join(''):'<div class="country-option">No country found</div>';
    options.querySelectorAll('.country-option[data-value]').forEach(el=>el.addEventListener('click',function(){value.value=this.dataset.value;search.value=this.dataset.value;picker.classList.remove('open');}));
  }
  search.addEventListener('focus',function(){picker.classList.add('open');render();});
  search.addEventListener('input',function(){value.value='';picker.classList.add('open');render();});
  document.addEventListener('click',function(e){if(!picker.contains(e.target))picker.classList.remove('open');});
  form.addEventListener('submit',function(e){
    const pw=document.getElementById('signupPassword');
    if(pw.value.length<8){e.preventDefault();pw.focus();return;}
    if(!value.value){e.preventDefault();search.focus();alert('Please select your country from the list.');}
  });
  const pw=document.getElementById('signupPassword');
  pw.addEventListener('input',function(){pw.classList.toggle('password-ok',pw.value.length>=8);pw.classList.toggle('password-bad',pw.value.length>0&&pw.value.length<8);});
})();
</script></body></html>
