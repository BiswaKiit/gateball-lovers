<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gateball Lovers - Sign Up</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#222}
.page{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding-bottom:78px}
.header{background:#f4a300;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:5}
.header h1{margin:0;font-size:21px}.header p{margin:4px 0 0;font-size:12px}
.content{padding:14px}.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000012}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px;background:#f4a300;color:#fff;font-weight:bold;cursor:pointer;text-decoration:none;text-align:center;margin-top:8px}
.btn.secondary{background:#eee;color:#222}.btn.green{background:#299447}.btn.red{background:#d64545}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:5px 0 10px;font-size:15px}
label{font-weight:bold;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center;background:#fff3d6;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px;color:#d88900}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs a{margin:0!important;padding:10px 4px!important}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#fff0c8;color:#9a6500;font-size:11px;font-weight:bold}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#777;font-size:13px}
.creator{margin:20px 0;text-align:center;color:#777;font-size:12px}.message{padding:10px;border-radius:9px;background:#f7f7f7;margin:8px 0}
.logo{width:88px;height:88px;object-fit:contain}.center{text-align:center}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd;z-index:10}
.bottom a{padding:11px 4px;text-align:center;text-decoration:none;color:#555;font-size:12px}.bottom a.active{color:#d88900;font-weight:bold}
</style>

<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/gateball-theme.css">
<script defer src="/static/gateball-app.js"></script>
<meta name="theme-color" content="#F47700">
</head>
<body><div class="page"><div class="header"><h1>Create Account</h1><p>Join the Gateball Family</p></div><div class="content"><div class="card">
<form method="post" action="/signup"><label>Full Name</label><input name="full_name" required>
<label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required>
<label>Country</label><input name="country"><label>Phone</label><input name="phone" type="tel">
<label>Role</label><select name="role"><option>Player</option><option>Organizer</option></select>
<button class="btn" type="submit">CREATE ACCOUNT</button></form>
<a class="btn secondary" href="/">BACK TO LOGIN</a></div><div class="creator">Created by Biswa Ranjan Mishra</div></div></div></body></html>
