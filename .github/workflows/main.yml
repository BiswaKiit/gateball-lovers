name: Build Gateball Lovers APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gateball Lovers
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Create Supabase configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os

          config = {
              "SUPABASE_URL": os.environ["SUPABASE_URL"],
              "SUPABASE_PUBLISHABLE_KEY": os.environ["SUPABASE_PUBLISHABLE_KEY"]
          }

          with open("supabase_config.json", "w", encoding="utf-8") as f:
              json.dump(config, f)
          PY

      - name: Prepare Buildozer configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text(encoding="utf-8")

          if "android.accept_sdk_license" not in text:
              text = text.replace(
                  "[app:android]\n",
                  "[app:android]\n"
                  "android.accept_sdk_license = True\n"
              )

          if "p4a.branch" not in text:
              text = text.replace(
                  "[app:android]\n",
                  "[app:android]\n"
                  "p4a.branch = develop\n"
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Prepare Android SDK with accepted licenses
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/licenses"

          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Download SDK, NDK and prepare python-for-android
        env:
          P4A_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          buildozer android p4a -- --help

      - name: Build debug APK
        env:
          P4A_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gateball-Lovers-debug-APK
          path: bin/*.apk
          if-no-files-found: error
